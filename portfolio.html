        <h2>Over mij</h2>
        <p>
           Zolang ik mij kan herinneren hebben twee dingen mij geboeid: Hoe dingen werken en vanuit niets, iets maken. Zowel op technisch als kunstzinnig vlak.<br> 
           In mijn vroege kindertijd hadden wij thuis géén computers, een bewuste keus van mijn ouders.<br>
           Midden/eind jaren 90 echter, raakte mijn vader in de ban van de PC en trok mij daarin mee.<br>
           Inmiddels waren spelcomputers thuis óók geoorloofd en werd er aardig wat gespeeld.<br>
        </p>
        <p>
           Al snel ontdekte ik hoe leuk het was om dingen aan te passen in spellen, levels te bouwen en graphics te maken/veranderen.<br>
           Ook werd er, met de opkomst van internet, wel eens wat geknutseld met HTML.<br>
           Van een familielid kreeg ik een toen al oude MSX computer met het ingebouwde MSX-Basic, dat was mijn eerste kennismaking met echt programmeren.<br>
           Een tijd lang zag ik een toekomst als gamedesigner/ontwikkelaar voor me, echter liep e.e.a. anders.
           Hoewel ik door de jaren heen computers ben blijven gebruiken voor allerlei doeleinden zoals muziek, beeldbewerking, gaming-<br>
           en ik zo af en toe een beginnetje heb gemaakt met een programmeertaal, af en toe een (Linux) installatie deed of een nieuwe PC bouwde stond de interesse op een laag pitje.<br>
