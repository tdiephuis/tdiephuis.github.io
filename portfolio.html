        <h2>Over mij</h2>
        <p>
           Zolang ik mij kan herinneren hebben twee dingen mij geboeid: Hoe dingen werken; en vanuit niets, iets maken, zowel op technisch als kunstzinnig vlak.<br>
           Dat zie je terug in mijn hobby's: Ik maak graag beeldende kunst, (electronische) muziek en ik ben amateur-horlogemaker.<br> 
           In mijn vroege kindertijd hadden wij thuis <em>géén</em> computers, een bewuste keus van mijn ouders.<br>
           Toch, midden/eind jaren 90 raakte mijn vader in de ban van de PC en trok mij daarin mee.<br>
        </p>
        <p>

           Van een familielid kreeg ik een toen al oude MSX computer met het ingebouwde MSX-Basic, dat was mijn eerste kennismaking met echt programmeren.<br>
           Een tijd was ik niet achter de computer weg te slaan, maar uiteindelijk heb ik er niet mijn werk van gemaakt, tegen de adviezen van mijn vader in! (Sorry pap!)<br>
           In 2026, na een periode ziek thuis te hebben gezeten van werk wat geen voldoening gaf, ben ik daar op 43-jarige leeftijd op terug gekomen.<br>
